requires-python = ">=3.12, <3.13"
dependencies = [
    "fastapi>=0.136.1",
    "httpx[http2]>=0.28.1",
    "ipykernel>=7.2.0",
    "jedi>=0.20.0",
    "langgraph>=1.2.9",
    "loguru>=0.7.3",
    "mistral-common[hf-hub]>=1.11.2",
    "neo4j>=6.1.0",
    "neomodel>=6.2.0",
    "openai>=2.37.0",
    "pathspec>=1.1.1",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "python-multipart>=0.0.32",
    "pyvis>=0.3.2",
    "rustworkx>=0.17.1",
    "sqlmodel>=0.0.39",
    "tree-sitter==0.25.0",
    "tree-sitter-python==0.25.0",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.21",
]
